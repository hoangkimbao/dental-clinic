server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

spring:
  application:
    name: dental-clinic
  datasource:
    url: jdbc:h2:file:./data/dentaldb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:demo@dentalcare.vn}
    password: ${SPRING_MAIL_PASSWORD:demopassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Enterprise Security & Business Configuration
app:
  upload:
    dir: ./uploads/dental-images/
  security:
    crypto:
      aes-key: DentalCare2026LuxuryClinicSecureKeyForMedicalEMRAES256GCM
  jwt:
    secret: dentalcareluxurysecuresecretkey2026superstrongforproductiontokengeneration32bytes
    expiration-ms: 86400000 # 24 hours
  clinic:
    deposit-amount: 100000.0 # Dynamic deposit setting
    name: DentalCare Luxury Clinic

# Spring Boot Actuator Monitoring Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
