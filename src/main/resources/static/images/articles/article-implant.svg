<svg viewBox="0 0 500 320" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Trồng Răng Implant Thụy Sĩ">
    <defs>
        <linearGradient id="bg-art-imp" x1="0" y1="0" x2="500" y2="320" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#082f49"/>
            <stop offset="60%" stop-color="#0369a1"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
    </defs>
    <rect width="500" height="320" rx="24" fill="url(#bg-art-imp)"/>
    <circle cx="420" cy="80" r="120" fill="#ffffff" fill-opacity="0.04"/>
    
    <!-- Implant Anatomy Graphic -->
    <g transform="translate(190, 30)">
        <!-- Porcelain Crown Top -->
        <path d="M30 65 C30 30 90 30 90 65 C90 85 85 95 80 100 L40 100 C35 95 30 85 30 65 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
        <!-- Abutment -->
        <polygon points="45,100 75,100 70,120 50,120" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
        <!-- Titanium Screw Thread with ridges -->
        <rect x="52" y="120" width="16" height="60" rx="3" fill="#94a3b8"/>
        <line x1="48" y1="130" x2="72" y2="135" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
        <line x1="48" y1="145" x2="72" y2="150" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
        <line x1="48" y1="160" x2="72" y2="165" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
        <polygon points="52,180 68,180 60,195" fill="#64748b"/>
        <!-- Measurement rings -->
        <circle cx="60" cy="115" r="50" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
    </g>
    
    <text x="40" y="275" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff">Quy Trình Cấy Ghép Implant Không Đau</text>
    <text x="40" y="295" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#7dd3fc">Trụ Titanium Thụy Sĩ &bull; Khôi phục ăn nhai trọn đời</text>
</svg>
