version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Service 1: Spring Boot Application (DentalCare Web Portal & APIs)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental-clinic-app
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/dentaldb;AUTO_SERVER=TRUE
      - APP_UPLOAD_DIR=/app/uploads/dental-images/
      - APP_JWT_SECRET=dentalcareluxurysecuresecretkey2026superstrongforproductiontokengeneration32bytes
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom
    volumes:
      - dental_data:/app/data
      - dental_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Service 2: Cloudflare Tunnel (Secure Public Ingress)
  # ----------------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: dental-clinic-tunnel
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dental_data:
    name: dental-clinic-data
  dental_uploads:
    name: dental-clinic-uploads
