version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Service 1: Spring Boot Application (DentalCare Web Portal & APIs)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental-clinic-app
    ports:
      # Bind strictly to loopback interface to prevent direct bypass of Cloudflare Tunnel
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:h2:file:/app/data/dentaldb;AUTO_SERVER=TRUE}
      - APP_UPLOAD_DIR=${APP_UPLOAD_DIR:-/app/uploads/dental-images/}
      - APP_JWT_SECRET=${APP_JWT_SECRET:-dentalcareluxurysecuresecretkey2026superstrongforproductiontokengeneration32bytes}
      - JAVA_OPTS=${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom}
    volumes:
      - dental_data:/app/data
      - dental_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Service 2: Cloudflare Tunnel (Secure Public Ingress)
  # Uses official distroless cloudflare/cloudflared image (no /bin/sh, curl, or wget).
  # Supports both TryCloudflare (ephemeral) and Named Tunnel (production custom domain)
  # via native cloudflared CLI and native readiness healthcheck.
  # ----------------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: dental-clinic-tunnel
    restart: unless-stopped
    command: ${CLOUDFLARE_TUNNEL_COMMAND:-tunnel --no-autoupdate --metrics 0.0.0.0:2000 run}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-${TUNNEL_TOKEN:-}}
      - TUNNEL_METRICS=0.0.0.0:2000
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  dental_data:
    name: dental-clinic-data
  dental_uploads:
    name: dental-clinic-uploads
